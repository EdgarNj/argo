apiVersion: apps/v1
kind: Deployment

metadata:
  name: k8s-web-hello
spec:
  replicas: 10
  strategy:
    type: "RollingUpdate"
  selector:    
    matchLabels:
      app: k8s-web-hello
  template:
    metadata:
      labels:
        app: k8s-web-hello
    spec:
      containers:
        
      - name: k8s-web-hello
        image: edgarnj/k8s-web-hello-am:2.0.4
        resources:
          limits:
            memory: "200Mi"
            cpu: "1000m"
        ports:
        - containerPort: 3000

        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 2
